# CodeQL static analysis of the Python code (push, pull request and a weekly run).
# Python needs no build, so build-mode is none. Actions pinned to commits, as everywhere in this repo.
name: CodeQL
on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write # uploading the results to code scanning
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:python"
