# Tests on every push to main and every pull request: the same checks as before a local commit.
name: Testy
on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # wydanie.yml runs the same checks before building a release
permissions:
  contents: read
jobs:
  testy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Biblioteki systemowe dla Qt (platforma offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalacja
        # Every dependency is pinned by hash (requirements-ci.txt, from pyproject.toml); the project itself is
        # installed without dependencies and without fetching a build backend.
        run: |
          pip install --require-hashes -r requirements-ci.txt
          pip install --no-deps --no-build-isolation -e .
      - name: Format i lint
        run: ruff format --check . && ruff check .
      - name: Testy (bez Dockera i pulpitu), pokrycie rdzenia ≥ 90%
        run: pytest --cov=dk_tracker.core --cov-fail-under=90
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Fuzzing (Atheris, 30 s) czystych funkcji rdzenia
        run: python fuzz/fuzz_core.py -max_total_time=30
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Dokumentacja
        run: |
          python3 .claude/skills/sprawdz-linki/linki.py sprawdz
          python3 .claude/skills/frontmatter/frontmatter.py sprawdz
          python3 .claude/skills/markdownlint/mdfix.py sprawdz
