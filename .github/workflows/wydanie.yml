# A release: pushing the tag v<version> runs the tests, builds the signed Flatpak, publishes the Flatpak
# repository on GitHub Pages (updates reach everyone who installed from it) and only then creates the
# GitHub release with the bundle, so the release never points at a repository that is not online.
# Needs: secret FLATPAK_GPG_PRIVATE_KEY (flatpak/klucz-gpg.sh), Pages source = GitHub Actions, and the
# github-pages environment allowing tags v* (docs/procesy/wydania.md).
# Every action is pinned to a commit (the repository requires it; the release job holds the GPG key);
# update them by hand, see docs/integracje/github-actions.md.
name: Wydanie
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  testy:
    # The './' form is asserted by tests/test_pakiet.py; the '$/' form would change nothing here.
    uses: ./.github/workflows/testy.yml # zizmor: ignore[self-repository]
  flatpak:
    needs: [testy]
    runs-on: ubuntu-24.04
    container:
      # The same image as flatpak/buduj.sh: Flatpak 1.18.1, KDE 6.11 SDK, appstreamcli, linter.
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag zgodny z wersją w pyproject.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, a pyproject.toml ma $version" >&2
            exit 1
          fi
      - name: MetaInfo i plik .desktop
        run: |
          appstreamcli validate --no-net data/*.metainfo.xml
          desktop-file-validate data/*.desktop
      - name: Klucz podpisujący repozytorium
        id: gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      - name: Budowa Flatpaka
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: flatpak/io.github.dragonking026.DK-Tracker-Linux.yml
          bundle: io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
      - name: Repozytorium Flatpak dla GitHub Pages
        run: >-
          flatpak/publikuj.sh repo site "https://dragonking026.github.io/DK-Tracker-Linux"
          "${{ steps.gpg.outputs.fingerprint }}"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0 (pins upload-artifact by SHA itself)
        with:
          path: site
      - name: Paczka dla wydania
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paczka
          path: io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak
          if-no-files-found: error
  pages:
    needs: [flatpak, poswiadczenie] # nothing goes online without the provenance attestation
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publikacja na GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  poswiadczenie:
    # Signed provenance of the bundle (Sigstore, verifiable with `gh attestation verify`). The bundle file is
    # attached to the release as <bundle>.sigstore.json, the name OpenSSF Scorecard (Signed-Releases) recognises.
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the Sigstore certificate of this run
      attestations: write # stores the attestation on GitHub
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paczka
      - name: Pochodzenie paczki
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak
      - name: Plik poświadczenia dla wydania
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          NAZWA: io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak.sigstore.json
        run: cp "$BUNDLE_PATH" "$NAZWA"
      - name: Poświadczenie dla wydania
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: poswiadczenie
          path: io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak.sigstore.json
          if-no-files-found: error
  wydanie:
    needs: [pages, poswiadczenie]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release with the bundle
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: paczka
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: poswiadczenie
      - name: Wydanie na GitHubie z paczką
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak
            io.github.dragonking026.DK-Tracker-Linux-${{ github.ref_name }}.flatpak.sigstore.json
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            Instalacja z aktualizacjami (Discover, GNOME Software, `flatpak update`):

            ```bash
            flatpak install --user https://dragonking026.github.io/DK-Tracker-Linux/io.github.dragonking026.DK-Tracker-Linux.flatpakref
            ```

            Plik `.flatpak` poniżej nie dostaje aktualizacji — tylko gdy strona repozytorium jest niedostępna.
            Jego pochodzenie sprawdzisz poleceniem `gh attestation verify <plik>.flatpak --repo DragonKing026/DK-Tracker-Linux --bundle <plik>.flatpak.sigstore.json`.
