# Weekly updates, each ecosystem in one pull request: the GitHub Actions pinned to commits, and the CI
# dependencies pinned by hash in requirements-ci.txt (compiled from pyproject.toml and requirements-ci.in).
# The Flatpak build installs its dependencies offline from flatpak/python3-deps.yaml, which Dependabot cannot update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-ci:
        patterns: ["*"]
    # Upper bounds of pyproject.toml: a newer major would not install in the app, so it is not proposed.
    ignore:
      - dependency-name: "pyside6*"
        versions: [">=6.12"]
      - dependency-name: "shiboken6"
        versions: [">=6.12"]
      - dependency-name: "ruff"
        versions: [">=0.17"]
      - dependency-name: "httpx"
        versions: [">=1"]
      - dependency-name: "jeepney"
        versions: [">=1"]
