# Weekly updates, each ecosystem in one pull request: the GitHub Actions pinned to commits, and the CI
# dependencies pinned by hash in requirements-ci.txt (compiled from pyproject.toml and requirements-ci.in).
# The Flatpak build installs its dependencies offline from flatpak/python3-deps.yaml, which Dependabot cannot update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-ci:
        patterns: ["*"]
