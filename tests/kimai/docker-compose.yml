# Local Kimai for contract/integration tests. Never exposed beyond 127.0.0.1.
# Driven by tests/kimai/kimai-testowe.sh — see tests/kimai/README.md.
name: kimai-tray-test

services:
  sqldb:
    image: mysql:8.3
    environment:
      - MYSQL_DATABASE=kimai
      - MYSQL_USER=kimai
      - MYSQL_PASSWORD=kimai
      - MYSQL_ROOT_PASSWORD=root
    command: --default-storage-engine innodb
    healthcheck:
      test: mysqladmin -proot ping -h localhost
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 30

  kimai:
    # Pinned so test results are reproducible; override with KIMAI_VERSION=2.xx.x.
    image: kimai/kimai2:${KIMAI_VERSION:-2.67.0}
    depends_on:
      sqldb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIMAI_TEST_PORT:-8001}:8001"
    environment:
      - APP_SECRET=kimai-tray-tests-not-a-secret-0123456789
      - TRUSTED_HOSTS=localhost|127.0.0.1
      - ADMINMAIL=admin@kimai.test
      - ADMINPASS=admin12345
      - "DATABASE_URL=mysql://kimai:kimai@sqldb/kimai?charset=utf8mb4&serverVersion=8.3.0"
