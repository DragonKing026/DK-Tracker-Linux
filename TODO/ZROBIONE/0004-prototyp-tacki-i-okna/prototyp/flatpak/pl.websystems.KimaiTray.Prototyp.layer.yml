# Throwaway Flatpak for the tray spike (task 0004): BaseApp + layer-shell-qt (window anchored at the tray on KDE).
# Build in a container: prototyp/flatpak/buduj-w-dockerze.sh (flatpak 1.18.2 on Fedora 44 cannot build --base).
app-id: pl.websystems.KimaiTray.Prototyp
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: tray-demo
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher   # the only extra permission the tray should need
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
modules:
  # Not in org.kde.Platform; must be built against the runtime's Qt (private QtWaylandClient API).
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://download.kde.org/stable/plasma/6.7.5/layer-shell-qt-6.7.5.tar.xz
        sha256: ccdcfec7081ca956f7a52c9113a4df3a226575bfbe98b56a2a9a4d7d7e19e8f0
  - name: tray-demo
    buildsystem: simple
    build-commands:
      - install -Dm644 tray_demo.py /app/lib/tray_demo.py
      - install -Dm755 tray-demo.sh /app/bin/tray-demo
    sources:
      - type: file
        path: ../tray_demo.py
      - type: script
        dest-filename: tray-demo.sh
        commands:
          - exec python3 /app/lib/tray_demo.py "$@"
