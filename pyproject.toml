[build-system]
requires = ["setuptools>=77"]  # PEP 639: license = "SPDX" (the Flatpak SDK has setuptools 80.10.2)
build-backend = "setuptools.build_meta"

[project]
name = "dk-tracker"
version = "0.10.3"
description = "System tray time tracking for Kimai"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "jeepney>=0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16,<0.17", "pytest-qt>=4.4", "pyyaml>=6", "packaging>=24"]
# In Flatpak PySide6 comes from io.qt.PySide.BaseApp, so it is not a hard dependency.
ui = ["PySide6>=6.11,<6.12"]

[project.scripts]
dk-tracker = "dk_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dk_tracker.core" = ["locales/*.json"]
"dk_tracker.ui" = ["assets/*"]
"dk_tracker.ui.main_window" = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not kimai and not desktop'"
qt_api = "pyside6"
markers = [
    "kimai: needs the local Kimai in Docker (tests/kimai/kimai-testowe.sh)",
    "desktop: needs a real desktop session (D-Bus, keyring)",
]

[tool.ruff]
line-length = 110
target-version = "py313"
# Only product code: agent tooling (.claude/), task prototypes (TODO/) and docs are out of scope.
extend-exclude = [".claude", "TODO", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG paths and QSS rules copied from the add-on read better unbroken.
"src/dk_tracker/ui/icons.py" = ["E501"]
"src/dk_tracker/ui/theme.py" = ["E501"]
