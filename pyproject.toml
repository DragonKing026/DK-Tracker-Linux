[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kimai-tray"
version = "0.1.0"
description = "System tray time tracking for Kimai"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28,<1", "jeepney>=0.9,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pytest-qt>=4.4"]
# In Flatpak PySide6 comes from io.qt.PySide.BaseApp, so it is not a hard dependency.
ui = ["PySide6>=6.11,<6.12"]

[project.scripts]
kimai-tray = "kimai_tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kimai_tray.core" = ["locales/*.json"]
"kimai_tray.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not kimai and not desktop'"
qt_api = "pyside6"
markers = [
    "kimai: needs the local Kimai in Docker (tests/kimai/kimai-testowe.sh)",
    "desktop: needs a real desktop session (D-Bus, keyring)",
]

[tool.ruff]
line-length = 110
target-version = "py313"
# Only product code: agent tooling (.claude/), task prototypes (TODO/) and docs are out of scope.
extend-exclude = [".claude", "TODO", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SVG paths and QSS rules copied from the add-on read better unbroken.
"src/kimai_tray/ui/icons.py" = ["E501"]
"src/kimai_tray/ui/theme.py" = ["E501"]
